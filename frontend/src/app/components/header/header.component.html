<mat-toolbar>
  <mat-progress-bar
    *ngIf="loading"
    class="loading-bar"
    mode="indeterminate"
    color="accent"
  ></mat-progress-bar>

  <button
    *ngIf="_enableHamburger"
    class="me-3"
    mat-icon-button
    (click)="onHamburgerClick.emit()"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <a [routerLink]="['/']" class="logo text-link">
    <div class="svg-logo">
      <img src="/assets/branding/logo/picsur.svg" alt="Picsur Icon Logo" />
    </div>
    <div class="svg-logo-text">
      <img
        src="/assets/branding/text/picsur_light.svg"
        class="ms-3 d-none d-sm-block"
        alt="Picsur Text Logo"
      />
    </div>
  </a>

  <span class="spacer"></span>

  <button
    [matTooltip]="'HEADER.UPLOAD_IMAGE' | translate"
    *ngIf="canUpload"
    mat-icon-button
    class="me-3"
    (click)="doUpload()"
  >
    <mat-icon fontSet="material-icons-outlined">upload</mat-icon>
  </button>

  <button
    matTooltip="{{ 'HEADER.SWITCH_LANGUAGE' | translate }}"
    mat-icon-button
    class="me-3"
    [matMenuTriggerFor]="languageMenu"
  >
    <mat-icon>language</mat-icon>
  </button>

  <button
    [matTooltip]="(canRegister ? 'HEADER.LOGIN_OR_REGISTER' : 'HEADER.LOGIN_TO_ACCOUNT') | translate"
    *ngIf="!isLoggedIn && canLogIn"
    mat-stroked-button
    (click)="doLogin()"
  >
    {{ 'HEADER.LOGIN' | translate }}
  </button>

  <!-- <span *ngIf="isLoggedIn" class="me-3 d-none d-sm-block">
    {{ user?.username }}
  </span> -->
  <button
    [matTooltip]="'HEADER.YOUR_ACCOUNT' | translate"
    *ngIf="isLoggedIn"
    mat-icon-button
    [matMenuTriggerFor]="menu"
  >
    <mat-icon fontSet="material-icons-outlined">account_circle</mat-icon>
  </button>

  <mat-menu #menu="matMenu" xPosition="before">
    <ng-template matMenuContent>
      <span>
        <div class="menu-username center-horizontally">
          <h2 class="mat-typography">{{ user?.username }}</h2>
        </div>
      </span>
      <button *ngIf="canUpload" mat-menu-item (click)="doImages()">
        <mat-icon fontSet="material-icons-outlined">image</mat-icon>
        <span>{{ 'HEADER.MY_IMAGES' | translate }}</span>
      </button>
      <button *ngIf="canAccessSettings" mat-menu-item (click)="doSettings()">
        <mat-icon fontSet="material-icons-outlined">settings</mat-icon>
        <span>{{ 'HEADER.SETTINGS' | translate }}</span>
      </button>
      <button mat-menu-item (click)="doLogout()">
        <mat-icon fontSet="material-icons-outlined">logout</mat-icon>
        <span>{{ 'HEADER.LOGOUT' | translate }}</span>
      </button>
    </ng-template>
  </mat-menu>

  <mat-menu #languageMenu="matMenu" xPosition="before">
    <button
      mat-menu-item
      *ngFor="let lang of availableLanguages"
      (click)="switchLanguage(lang.code)"
      [class.active]="currentLanguage === lang.code"
    >
      <mat-icon *ngIf="currentLanguage === lang.code">check</mat-icon>
      <mat-icon *ngIf="currentLanguage !== lang.code" style="visibility: hidden;">check</mat-icon>
      <span>{{ lang.name }}</span>
    </button>
  </mat-menu>
</mat-toolbar>
